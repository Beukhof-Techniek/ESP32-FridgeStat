; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
  ;-D LED_BUILTIN=2
  ; Max (and default) debugging level in Arduino ESP32 Core
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE ;ARDUHAL_LOG_LEVEL_INFO
  ; Arduino Core bug workaround: define the log tag for the Arduino
  ; logging macros.
  -D TAG='"Arduino"'
  ; Use the ESP-IDF logging library - required by SensESP.
  -D USE_ESP_IDF_LOG
  ;-D ONLY_SETUP
  ;-D CONFIG_ESP_TASK_WDT_TIMEOUT_S=10

board_build.partitions = min_spiffs.csv

lib_deps =
    SignalK/SensESP
    SensESP/OneWire
    Adafruit SSD1306
    olikraus/U8g2@^2.36.18
;    paulstoffregen/OneWire
;    milesburton/DallasTemperature